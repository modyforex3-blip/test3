services:
  - type: web
    name: millionair-pwa-hub
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    disk:
      name: pwa-storage
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: BASE_DOMAIN
        value: millionair.site
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
