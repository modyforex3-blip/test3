<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Hexagon Badge with Glow -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" 
           fill="#0b1322" 
           stroke="url(#emeraldGrad)" 
           stroke-width="3" 
           filter="url(#glowEffect)" />

  <!-- Inner Geometric Accent -->
  <polygon points="50,11 83,30 83,70 50,89 17,70 17,30" 
           fill="none" 
           stroke="url(#goldGrad)" 
           stroke-width="1.5" 
           stroke-opacity="0.6" 
           stroke-dasharray="4 2" />

  <!-- Crown / Star Crest at Top -->
  <path d="M42,27 L50,19 L58,27 L55,29 L50,25 L45,29 Z" 
        fill="url(#goldGrad)" />
  <circle cx="50" cy="18" r="2" fill="#fef08a" />

  <!-- Stylized Elegant 'M' Emblem -->
  <path d="M30,68 L30,36 L43,53 L50,44 L57,53 L70,36 L70,68 L62,68 L62,48 L54,58 L46,58 L38,48 L38,68 Z" 
        fill="url(#emeraldGrad)" />

  <!-- Gold Core Diamond Accent -->
  <polygon points="50,56 55,62 50,68 45,62" fill="url(#goldGrad)" />
</svg>
