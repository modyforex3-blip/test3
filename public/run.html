<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Smart Ad Frequency & User Experience Controller -->
  <script src="/js/ad-frequency.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>تشغيل التطبيق | مليونير</title>
  
  <!-- Monetag Official Verification Meta Tag -->
  <meta name="monetag" content="0167ea94057a766eea2813d6211ed27b">
  
  <!-- Google AdSense Official Script -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6429184518728912" crossorigin="anonymous"></script>
  
  <!-- PWA Manifest & Meta -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مليونير">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-[#080c14] text-slate-100 flex flex-col min-h-screen">

  <!-- TOP AD BANNER (Google AdSense / Monetag Responsive Sticky Banner) -->
  <aside id="topAdContainer" class="ad-container-top" aria-label="إعلان ممول">
    <div class="ad-inner-wrapper">
      <div class="ad-banner-clean flex flex-col md:flex-row items-center justify-center w-full min-h-[50px] text-center gap-2">
        <div class="monetag-slot w-full max-w-[728px] min-h-[50px] flex items-center justify-center" data-monetag-zone="12339753"></div>
        <ins class="adsbygoogle" style="display:inline-block;width:100%;max-width:728px;min-height:50px" data-ad-client="ca-pub-6429184518728912" data-ad-slot="6300978111" data-ad-format="horizontal" data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>
    </div>
  </aside>

  <!-- NAVBAR -->
  <header class="bg-[#0b0f17] border-b border-white/10 px-4 sm:px-8 py-3 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <a href="/" class="flex items-center gap-2">
        <div class="w-8 h-8 brand-logo-icon">
          <img src="/assets/logo.svg" alt="مليونير Logo" class="w-full h-full object-contain">
        </div>
        <span class="text-xl font-black brand-title">مليونير</span>
      </a>
      <span class="text-gray-500">|</span>
      <span class="text-xs text-emerald-400 font-bold hidden sm:inline">مشغل التطبيقات السحابي (Web Runner)</span>
    </div>

    <div class="flex items-center gap-3">
      <!-- User Reward Points Widget -->
      <div class="reward-points-widget" onclick="window.RewardSystem && window.RewardSystem.openRewardModal()" title="رصيد المكافآت - اضغط لكسب المزيد">
        <i class="fas fa-coins text-amber-400"></i>
        <span class="font-black text-xs text-white"><span class="user-points-val">100</span> نقطة</span>
      </div>

      <a id="backToDetailsBtn" href="/app.html" class="btn-secondary text-xs py-1.5 px-3 flex items-center gap-1.5">
        <i class="fas fa-arrow-right text-[10px]"></i>
        <span>صفحة تفاصيل التطبيق</span>
      </a>
      <a href="/" class="btn-secondary text-xs py-1.5 px-3 flex items-center gap-1.5">
        <i class="fas fa-home text-[10px]"></i>
        <span>الرئيسية</span>
      </a>
    </div>
  </header>

  <!-- RUNNER CONTAINER -->
  <main class="flex-1 max-w-7xl mx-auto px-2 sm:px-6 lg:px-8 py-6 w-full flex flex-col">
    
    <div id="runnerContainer" class="runner-container flex-1">
      
      <!-- Toolbar -->
      <div class="runner-toolbar flex-wrap gap-3">
        <div class="flex items-center gap-3">
          <img id="runnerAppIcon" src="" class="w-10 h-10 rounded-xl object-cover bg-slate-800 border border-white/10">
          <div>
            <h1 id="runnerAppName" class="font-bold text-sm sm:text-base text-white"></h1>
            <span id="runnerAppCategory" class="category-pill text-[10px]"></span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Watch Rewarded Ad for Points Button -->
          <button data-reward-btn="true" class="btn-watch-reward-ad btn-gold text-xs py-1.5 px-3 font-bold flex items-center gap-1.5 cursor-pointer shadow-md hover:scale-105 transition-all" title="شاهد إعلان واحصل على مكافأة فورية + اطلع على مميزات التطبيق">
            <i class="fas fa-gift text-amber-900"></i>
            <span>شاهد إعلان (+50 نقطة)</span>
          </button>

          <!-- Open Direct PWA in New Tab -->
          <a id="directAppPwaBtn" href="/apps/millionaire/" target="_blank" class="btn-secondary text-xs py-1.5 px-3 font-bold flex items-center gap-1.5" title="فتح التطبيق كنافذة مستقلة PWA">
            <i class="fas fa-external-link-alt"></i>
            <span class="hidden sm:inline">نافذة PWA كاملة</span>
          </a>

          <!-- Install on Mobile PWA Button -->
          <button id="installAppBtn" class="btn-gold text-xs py-1.5 px-3 font-bold flex items-center gap-1.5" title="تثبيت التطبيق على الموبايل">
            <i class="fas fa-mobile-alt"></i>
            <span class="hidden sm:inline">تثبيت التطبيق على الموبايل</span>
          </button>

          <!-- Reload App -->
          <button id="reloadAppBtn" class="btn-secondary text-xs p-2" title="إعادة تشغيل التطبيق">
            <i class="fas fa-redo-alt"></i>
          </button>

          <!-- Fullscreen Toggle -->
          <button id="fullscreenBtn" class="btn-secondary text-xs p-2" title="وضع ملء الشاشة">
            <i class="fas fa-expand"></i>
          </button>
        </div>
      </div>

      <!-- In-App Integrated Top Ad Banner -->
      <div id="runnerInAppTopAd" class="in-app-ad-banner in-app-top">
        <div class="ad-inner-wrapper w-full">
          <div class="ad-banner-clean flex items-center justify-center w-full min-h-[48px]">
            <div class="monetag-slot w-full max-w-[728px] min-h-[48px] flex items-center justify-center" data-monetag-zone="12339753"></div>
            <ins class="adsbygoogle" style="display:inline-block;width:100%;max-width:728px;min-height:48px" data-ad-client="ca-pub-6429184518728912" data-ad-slot="6300978111" data-ad-format="horizontal" data-full-width-responsive="true"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
          </div>
        </div>
      </div>

      <!-- Application Viewport -->
      <div id="runnerViewport" class="runner-viewport flex-1">
        <!-- Injected via runner.js -->
      </div>

      <!-- In-App Integrated Bottom Ad Banner -->
      <div id="runnerInAppBottomAd" class="in-app-ad-banner in-app-bottom">
        <div class="ad-inner-wrapper w-full">
          <div class="ad-banner-clean flex items-center justify-center w-full min-h-[48px]">
            <div class="monetag-slot w-full max-w-[728px] min-h-[48px] flex items-center justify-center" data-monetag-zone="12339753"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- PWA Mobile Install Info Card -->
    <div class="pwa-install-badge mt-6 flex flex-col sm:flex-row items-center justify-between gap-4">
      <div class="flex items-center gap-3 text-center sm:text-start">
        <div class="w-12 h-12 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center flex-shrink-0 text-xl">
          <i class="fas fa-mobile-screen-button"></i>
        </div>
        <div>
          <h4 class="font-bold text-sm text-white">هل ترغب في استخدام هذا التطبيق مباشرة من هاتفك المحمول؟</h4>
          <p class="text-xs text-gray-400 mt-0.5">يمكنك تثبيت هذا التطبيق الآن كـ Web App على هاتفك (Android و iOS) مع استمرار تشغيل الإعلانات والمميزات كاملة.</p>
        </div>
      </div>
      <button onclick="promptPWAInstall()" class="btn-primary text-xs py-2.5 px-5 font-bold whitespace-nowrap">
        <i class="fas fa-download"></i> تثبيت التطبيق الآن
      </button>
    </div>

  </main>

  <!-- BOTTOM AD BANNER (Monetag / Google AdSense Clean Placement) -->
  <aside id="bottomAdContainer" class="ad-container-bottom" aria-label="إعلان ممول">
    <div class="ad-inner-wrapper">
      <div class="ad-banner-clean flex items-center justify-center w-full min-h-[50px] text-center">
        <div class="monetag-slot w-full max-w-[728px] min-h-[50px] flex items-center justify-center" data-monetag-zone="12339753"></div>
      </div>
    </div>
  </aside>

  <script src="/js/i18n.js"></script>
  <script src="/js/runner.js"></script>
  <script src="/js/ad-guard.js"></script>
  <script src="/js/reward-system.js"></script>
  <script src="/js/monetag-ads.js"></script>
  <script>
    // Register /sw(2).js as primary Service Worker for Mobile PWA & Adaptive Ads
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw(2).js', { scope: '/' }).catch(function(){});
      });
    }
  </script>
</body>
</html>
