<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#1E293B" stroke-width="8" />
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#emerald)" stroke-width="12" opacity="0.3" stroke-dasharray="24 12" />
  
  <!-- Center Coin / Emblem -->
  <circle cx="256" cy="256" r="120" fill="url(#emerald)" />
  <circle cx="256" cy="256" r="100" fill="#0F172A" />
  
  <!-- Arabic Letter 'م' / Millionaire Crown -->
  <text x="256" y="300" font-family="'Alexandria', 'Tajawal', sans-serif" font-size="130" font-weight="900" fill="url(#gold)" text-anchor="middle">مـ</text>
  
  <!-- Sparkle Accents -->
  <path d="M 370 140 Q 380 150 390 150 Q 380 150 370 160 Q 380 150 370 140" fill="#FBBF24" />
</svg>
